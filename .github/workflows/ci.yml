name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.6.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm --filter @mfe-ssr/core build
      - run: pnpm --filter @mfe-ssr/import-map build
      - run: pnpm --filter @mfe-ssr/node build
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm test:loader-integration
      - run: pnpm test:package-consumer
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
