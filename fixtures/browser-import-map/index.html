<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Browser Import Map Fixture</title>
    <script type="importmap">
      {
        "imports": {
          "@mfe/fixture/remote": "./remote.mjs"
        }
      }
    </script>
  </head>
  <body>
    <output id="result">loading</output>
    <script type="module">
      import { message } from '@mfe/fixture/remote';

      document.querySelector('#result').textContent = message;
    </script>
  </body>
</html>
